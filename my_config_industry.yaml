# =============================================================================
# Pharsight 医药行业研究（pharma_industry）—— 初始配置
# =============================================================================
# 依据：docs/v1/PHARMA_RESEARCH_WORKFLOW_AND_FINSIGHT_ADAPTATION.md
#   §5   行业研究流程：从疾病与诊疗路径出发，而不是拼接多家公司报告
#   §7.4 建议的配置契约：首跑关闭自动任务、实时搜索与图表
#   §7.6 行业模式固定研究清单
#
# 默认口径（全覆盖）：
#   1 个明确疾病/治疗领域；默认穷尽该领域全部已上市产品、在研管线和相关公司；
#   中国内地辖区；标准治疗与在研管线并重；市场规模用权威口径 + 患者漏斗双重测算；
#   输出无图表的中文 Markdown 行业报告。
#
# 运行前准备：
#   1) 环境变量（写入 pharsight/.env，切勿提交）：
#        DS_MODEL_NAME / DS_API_KEY / DS_BASE_URL     —— 主模型（必填）
#   2) 复制本文件到 user_configs/pharma_industry.yaml（该目录已被 gitignore）
#   3) 按 pharma_evidence_manifest.yaml 模板准备授权一手资料并填写 source_manifest
#   4) python run_report.py --config user_configs/pharma_industry.yaml --no-resume
#
# 首跑不需要 Embedding、VLM、Serper 或浏览器，原因见下方开关注释。
# =============================================================================

# -----------------------------------------------------------------------------
# 一、研究任务书：冻结行业边界、时间与问题（流程 §5.1）
# -----------------------------------------------------------------------------

# 研究对象：明确的细分行业、疾病领域或技术路线（示例，运行前请替换）
target_name: "GLP-1 减重与降糖药物"

# 行业模式不要求证券代码，保留空字符串
stock_code: ""

# 研究模式：pharma_company（上市公司）或 pharma_industry（行业）
target_type: "pharma_industry"

# 市场：A｜HK｜US，仅作标识；本项目优先 A/H
market: "A/H"

# 输出语言：zh｜en，医药研报默认中文
language: "zh"

# 信息截止时间：ISO-8601 且必须带时区；晚于该时间的资料不得进入当期结论
as_of: "2026-09-21T23:59:59+08:00"

# 监管与商业化辖区：中国内地；如覆盖海外市场，可追加 "US"、"EU"
jurisdictions: ["CN"]

# 行业模式一般不做单资产限定，保持空列表
focus_assets: []

# 行业关注范围：用适应症/疾病界定边界（示例，运行前请替换）
focus_indications: ["2 型糖尿病", "肥胖症"]

# 本次要回答的核心争议：行业报告结论必须回到这些问题
research_questions:
  - "当前标准治疗与未满足需求是什么？"
  - "哪些技术路线、在研管线和政策事件可能改变行业价值分配？"
  - "市场规模测算的口径差异和关键假设是什么？"

# -----------------------------------------------------------------------------
# 二、输出与模板
# -----------------------------------------------------------------------------

# 输出目录：必须位于 pharsight 仓库内；outputs/ 已被 gitignore，产物不入库
output_dir: "./outputs/pharma-industry-v1"

# 输出格式：首跑只验收 Markdown；docx/pdf 转换属环境相关的次级验收
output_formats: ["md"]

# 中文行业报告大纲模板（报告章节结构）
outline_template_path: "src/template/pharma_industry_outline_zh.md"

# DOCX 样式模板：仅当 output_formats 含 docx 时使用，Markdown 首跑可忽略
reference_doc_path: "src/template/report_template_yulan.docx"

# -----------------------------------------------------------------------------
# 三、来源计划与工作流开关（流程 §7.4、§7.5）
# -----------------------------------------------------------------------------

# 受控资料包：指南、试验注册、监管与医保文件、权威统计、A/H 法定披露等。
# 相对路径以 pharsight 仓库根目录解析；运行前该清单必须存在且至少含 1 条
# 不晚于 as_of 的来源，否则流程按设计失败关闭。
# 模板见 docs/example_configs/pharma_evidence_manifest.yaml。
source_manifest: null

# 关闭 LLM 自动扩展任务，只执行下方固定研究清单，保证首跑可复现
auto_generate_tasks: true

# 关闭实时搜索：首跑只用受控资料包，不依赖 Serper/浏览器
live_web_search: true

# 分析与写作阶段不联网；需要发现线索时再逐项打开
live_web_search_in_analysis: true
live_web_search_in_report: true

# 严格截止时间：发布或更新时间晚于 as_of 的来源直接排除
strict_cutoff: true

# 严格引用：只允许 [Source:Sxxx] 形式，且必须解析到本次资料包中的来源
strict_citations: true

# 要求重大事实必须带引用；无引用报告不得发布
require_citations: true

# 任一采集/分析任务失败即中止，不静默降级
fail_fast: true

# 首跑关闭图表与 VLM 路径，先验证内容主流程
enable_chart: false

# 工具白名单：首跑只放开 pharma 受控证据工具；
# 需要行业/宏观总量指标时改为 ["pharma", "industry", "macro"]，
# 但此类结果不携带来源编号，重大数字仍须以资料包为准
allowed_tool_categories: ["pharma"]

# 按任务选择证据：证据条数超过阈值时，只把与当前分析/章节最相关的来源注入提示词，
# 未展示的记录仍可在代码中按 data_id 读取。auto（默认）｜off（总是全量）｜llm（总是选择）
evidence_selection: "auto"
evidence_selection_threshold: 10   # auto 模式下证据超过该条数才启用选择
evidence_selection_max_k: 12       # 单个分析/章节任务最多注入的来源数

# 断点续跑缓存：输入、模型、代码和资料快照变化后请改用 --no-resume
use_collect_data_cache: true
use_analysis_cache: true
use_report_outline_cache: true
use_full_report_cache: true
use_post_process_cache: true

# -----------------------------------------------------------------------------
# 四、固定采集任务（流程 §5 第 1–9 步 / §7.6 行业清单）
# -----------------------------------------------------------------------------
custom_collect_tasks:
  - "收集疾病负担、诊断分层、治疗线次、患者可及性和未满足需求的一手统计与指南"
  - "收集当前标准治疗、批准标签、疗效、安全性、价格和医保/集采信息"
  - "穷尽该疾病/技术领域的全部已上市产品与在研管线，按靶点/技术路线、药物、适应症、地区和试验号建立清单"
  - "收集监管、医保、集采和产业政策及其生效时间、适用范围与官方原文"
  - "收集市场规模的权威统计口径，以及患者漏斗自下而上测算所需的全部输入"
  - "穷尽该领域相关公司，收集产业链上中下游、主要参与者、A/H 上市公司业务暴露、财务与估值数据"

# -----------------------------------------------------------------------------
# 五、固定分析任务（流程 §5 第 2–12 步：来源事实、计算、假设与判断分离）
# -----------------------------------------------------------------------------
custom_analysis_tasks:
  - "界定行业边界与排除项，分析疾病负担、患者路径、标准治疗和未满足需求"
  - "比较靶点、作用机制、技术路线、已上市产品和在研管线的证据等级与局限"
  - "分析监管、医保和集采如何影响价格、可及性、放量和竞争格局"
  - "用权威口径与患者漏斗双重测算市场规模，披露口径差异并给出情景假设"
  - "分析产业链经济性、进入壁垒、竞争格局和利润分配"
  - "比较 A/H 上市公司收入暴露、竞争力和估值，形成映射表"
  - "整理行业催化剂与风险事件日历，明确证伪条件和传导路径"
  - "形成行业结论：景气判断、结构机会和证伪条件，并标注证据缺口"

# -----------------------------------------------------------------------------
# 六、模型配置：受控首跑只需要主模型；不要在配置中写明文密钥
# -----------------------------------------------------------------------------
llm_config_list:
  - model_name: "${DS_MODEL_NAME}"   # 主模型（环境变量）
    api_key: "${DS_API_KEY}"         # API Key（环境变量，禁止提交）
    base_url: "${DS_BASE_URL}"       # 兼容 OpenAI 协议的接口地址
    generation_params:
      temperature: 0.3               # 低温以保持事实一致性和可复现性
      max_tokens: 32768
      top_p: 0.95
  - model_name: "${EMBEDDING_MODEL_NAME}"
    api_key: "${EMBEDDING_API_KEY}"
    base_url: "${EMBEDDING_BASE_URL}"
  - model_name: "${VLM_MODEL_NAME}"
    api_key: "${VLM_API_KEY}"
    base_url: "${VLM_BASE_URL}"