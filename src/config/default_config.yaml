target_name: "商汤科技"
stock_code: "00020"
target_type: 'company'  # company, macro, industry
market: 'A'  # A (Chinese A-share), HK (Hong Kong), US (United States)
output_dir: "./outputs/exp-v1"
language: 'zh' # zh,en
as_of: null
jurisdictions: []
focus_assets: []
focus_indications: []
research_questions: []
source_manifest: null

# Workflow controls. Pharmaceutical example configs override these with
# deterministic, fail-closed defaults for the first end-to-end run.
auto_generate_tasks: true
live_web_search: true
search_provider: 'serper'
live_web_search_in_analysis: false
live_web_search_in_report: false
strict_cutoff: true
strict_citations: false
fail_fast: false
enable_chart: true
output_formats: ['md', 'docx', 'pdf']
allowed_tool_categories: []

# Task-level evidence selection for analysis and report prompts.
# auto: narrow only when the catalog exceeds evidence_selection_threshold;
# off: always inject the full catalog; llm: always let the model select.
evidence_selection: 'auto'
evidence_selection_threshold: 10
evidence_selection_max_k: 12

# Evidence retrieval. Graph/hybrid reuse the primary DS_MODEL_NAME for
# extraction, entity/relationship construction and query planning.
retrieval_backend: 'chunk'  # chunk, graph, hybrid
graph_build_on_ingest: true
graph_store_path: './outputs/.graph_cache/pharsight_graph.sqlite3'
graph_max_hops: 2
graph_top_k: 8
graph_query_planning_timeout: 30
graph_relation_candidate_limit: 100
graph_relation_confidence_threshold: 0.7

# Conversation-history guards (characters) for long agent runs.
# A single action result longer than max_action_result_chars is truncated
# before entering the chat history. Once the history exceeds
# max_history_chars, the oldest turns are elided while the initial task and
# the latest turns are preserved.
max_action_result_chars: 20000
max_history_chars: 300000
deep_search_max_iterations: 8
code_execution_timeout: 360

# Per-service rate limits (seconds between consecutive calls)
rate_limits:
  search_engines: 1.0
  financial_apis: 0.5
  fred_api: 0.5
  yfinance: 0.2

use_collect_data_cache: True
use_analysis_cache: True
use_report_outline_cache: True
use_full_report_cache: True
use_post_process_cache: True

llm_config_list:
  - model_name: "${DS_MODEL_NAME}"
    api_key: "${DS_API_KEY}"
    base_url: "${DS_BASE_URL}"
    generation_params:
      temperature: 0.5
      max_tokens: 1000
      top_p: 1
  - model_name: "${EMBEDDING_MODEL_NAME}"
    api_key: "${EMBEDDING_API_KEY}"
    base_url: "${EMBEDDING_BASE_URL}"
  - model_name: "${VLM_MODEL_NAME}"
    api_key: "${VLM_API_KEY}"
    base_url: "${VLM_BASE_URL}"
