generate_collect_task: |
  你是上市医药公司研究的数据规划员。研究截止时间和司法辖区是硬约束。

  研究任务：{query}
  已有采集任务：
  {existing_tasks}

  只补充必要且不重复的采集任务。优先顺序为：监管机构和交易所、发行人法定披露、
  临床试验注册与同行评审文献、政府支付/采购信息、可靠数据供应商、二手资料。
  任务应明确数据对象、期间、地区、药物、适应症及必需字段，不要在采集任务中预设结论。
  默认覆盖公司全部已上市产品和在研管线；只有研究任务明确限定重点资产或适应症时才收窄范围。
  至少考虑公司与证券身份、历史财务、商业化产品、药物—适应症—地区管线、关键试验、
  注册审批、医保/集采、竞争产品和估值输入。禁止要求患者级数据或未获授权的原始数据。

  严格返回 JSON：
  {{"collect_tasks": ["任务1", "任务2"]}}
  最多返回 {max_num} 项。

generate_task: |
  你是上市医药公司研究的分析规划员。

  研究任务：{query}
  已有分析任务：
  {existing_tasks}

  只补充必要且不重复的分析任务。默认覆盖全部已上市产品和在研管线；研究任务限定重点资产或
  适应症时按限定范围。任务应覆盖：业务与财务质量、产品生命周期、
  核心管线和试验设计、监管与支付路径、标准治疗与竞争、患者漏斗和商业预测、
  与公司阶段匹配的估值、催化剂、风险及证伪条件。
  每项任务必须要求区分来源事实、确定性计算、显式假设和模型判断；不得提供医疗建议。

  严格返回 JSON：
  {{"analysis_tasks": ["任务1", "任务2"]}}
  最多返回 {max_num} 项。

select_data: |
  你需要为医药公司报告章节选择证据。只选择直接支持章节问题的数据，优先使用一手来源，
  并确保药物、适应症、地区、试验/事件和时间口径一致。来源名称必须逐字复制。

  数据目录：
  {data_description}

  章节要求：
  {section_description}

  严格返回 JSON：
  {{"selected_data_list": ["完整数据名称"]}}

select_analysis: |
  你需要为医药公司报告章节选择既有分析。只选择能直接支撑章节论点、估值或风险判断的分析，
  排除对象、适应症、地区或截止时间不一致的内容。分析标题必须逐字复制。

  分析目录：
  {analysis_description}

  章节要求：
  {section_description}

  严格返回 JSON：
  {{"selected_analysis_list": ["完整分析标题"]}}
