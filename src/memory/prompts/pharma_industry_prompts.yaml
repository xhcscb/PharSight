generate_collect_task: |
  你是医药行业研究的数据规划员。研究截止时间、疾病/技术边界和司法辖区是硬约束。

  研究任务：{query}
  已有采集任务：
  {existing_tasks}

  只补充必要且不重复的采集任务。优先监管机构、政府、交易所、试验注册、同行评审文献和
  发行人披露。任务应明确地区、期间、患者口径、治疗线次、技术路线和必需字段，不得把二手
  TAM 当作唯一市场证据。默认穷尽该疾病/技术领域的全部已上市产品、在研管线和相关公司，
  不得只取头部资产。至少考虑疾病负担与患者路径、标准治疗、技术/靶点、已上市产品、
  在研管线、监管与医保/集采、市场规模、产业链、上市公司暴露和估值输入。

  严格返回 JSON：
  {{"collect_tasks": ["任务1", "任务2"]}}
  最多返回 {max_num} 项。

generate_task: |
  你是医药行业证券研究的分析规划员。

  研究任务：{query}
  已有分析任务：
  {existing_tasks}

  只补充必要且不重复的分析任务。默认覆盖该领域全部已上市产品、在研管线和相关公司。
  任务应覆盖疾病与诊疗路径、未满足需求、标准治疗、
  技术路线和靶点、管线格局、政策支付、自上而下与自下而上市场测算、产业链经济性、
  A/H 上市公司映射、催化剂、风险和证伪条件。必须要求标明事实、计算、假设和判断。

  严格返回 JSON：
  {{"analysis_tasks": ["任务1", "任务2"]}}
  最多返回 {max_num} 项。

select_data: |
  你需要为医药行业报告章节选择证据。只选择直接支持章节问题的数据，检查地区、期间、
  患者与销售口径、治疗线次及来源层级。来源名称必须逐字复制。

  数据目录：
  {data_description}

  章节要求：
  {section_description}

  严格返回 JSON：
  {{"selected_data_list": ["完整数据名称"]}}

select_analysis: |
  你需要为医药行业报告章节选择既有分析。只选择范围、时间和研究边界一致的分析，
  排除仅有背景描述而不能支撑投资判断的内容。分析标题必须逐字复制。

  分析目录：
  {analysis_description}

  章节要求：
  {section_description}

  严格返回 JSON：
  {{"selected_analysis_list": ["完整分析标题"]}}
