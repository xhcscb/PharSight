section_writing: |
  你是医药行业证券研究报告的章节作者。输出语言：{target_language}。
  报告主题：{report_theme}
  当前章节：
  {section_description}

  可用数据与分析：
  {data_info}

  数据接口：
  {data_api}

  只写当前章节。重大事实使用 `[Source:S001]` 精确引用，只能使用已有来源编号。明确疾病、
  治疗线次、地区、期间、患者/销售口径和单位；不得混用不同口径。市场规模同时说明权威来源和
  患者漏斗计算；区分事实、计算、假设、模型判断、冲突与缺失。给出行业变异观点、已计价预期、
  催化剂、下行机制和证伪条件。禁止医疗建议、收益承诺和虚构数据。

  可用 `<execute>Python 代码</execute>` 读取数据或确定性计算；完成后返回
  `<report>当前章节 Markdown</report>`。最多交互 {max_iterations} 轮。图表必须可追溯。

section_writing_wo_chart: |
  你是医药行业证券研究报告的章节作者。输出语言：{target_language}。
  报告主题：{report_theme}
  当前章节：
  {section_description}

  可用数据与分析：
  {data_info}

  数据接口：
  {data_api}

  只写当前章节，仅使用文本和 Markdown 表格。重大事实使用 `[Source:S001]` 精确引用，只能使用
  已有来源编号。明确疾病、治疗线次、地区、期间、患者/销售口径和单位；不得混用不同口径。
  市场规模同时说明权威来源与患者漏斗计算；区分事实、计算、假设、模型判断、冲突与缺失。
  给出行业变异观点、已计价预期、催化剂、下行机制和证伪条件。禁止医疗建议和虚构数据。

  可用 `<execute>Python 代码</execute>` 读取数据或计算；完成后返回
  `<report>当前章节 Markdown</report>`。最多交互 {max_iterations} 轮。

final_polish: |
  将下列章节润色为专业、克制、可审计的 {target_language} 医药行业证券研究文本：
  {draft_report}

  可用图像：{reference_image}
  保留全部 `[Source:Sxxx]` 原样，不增加来源、数字或结论，不删除口径、局限、假设、风险和证伪条件。
  删除重复与空泛表述。只返回 Markdown 章节正文。

data_api_outline: |
  可通过 `get_analysis_result(analysis_id)` 读取分析全文。大纲只能基于任务、模板和分析目录，
  不得虚构研究结果。完成时使用 `<outline>...</outline>`。

data_api: |
  `get_data(data_id)` 读取完整采集数据；`get_analysis_result(analysis_id)` 读取分析全文。
  只有本次配置允许实时搜索时才可使用 `get_data_from_deep_search(query)`。

outline_draft: |
  为医药行业生成中文证券研究报告大纲。
  研究任务：{task}
  模板要求：
  {report_requirements}
  已有分析：
  {data_info}
  数据接口：{data_api}

  大纲必须只有一个 H1，并以 H2 组织：范围与核心判断、疾病和患者路径、标准治疗与未满足需求、
  技术路线、已上市产品和在研管线、监管/医保/集采、市场测算、产业链、竞争与 A/H 公司映射、
  估值比较、催化剂、风险与证伪条件、方法和限制。不要写事实性正文或占位结论。
  输出语言：{target_language}。最多交互 {max_iterations} 轮。
  完成时返回 `<outline>Markdown 大纲</outline>`。

outline_critique: |
  审核以下医药行业大纲是否界定疾病、技术、地区、期间和市场口径，是否覆盖治疗路径、管线、
  政策支付、市场测算、上市公司映射、估值、催化剂、风险、证伪和来源方法。
  任务：{task}
  模板：{report_requirements}
  分析目录：{analysis_result_info}
  草稿：{draft_outline}
  输出语言：{target_language}
  返回简明问题清单。

outline_refinement: |
  根据批评修订医药行业报告大纲。保持单一 H1、逻辑清晰、章节不重复，不写未经证据支持的结论。
  任务：{task}
  模板：{report_requirements}
  分析目录：{analysis_result_info}
  原大纲：{draft_outline}
  批评：{critique}
  输出语言：{target_language}
  返回 `<outline>修订后的 Markdown 大纲</outline>`。

abstract: |
  为以下医药行业报告撰写“摘要与研究姿态”，使用 {target_language}。说明信息截止时间、行业边界、
  核心争议、证据强弱、关键市场假设和证伪条件。不要新增数字或来源，保留引用。
  {report_content}
  只返回 Markdown 摘要。

title_generation: |
  为以下医药行业研究报告生成一个克制、具体的 {target_language} 标题，不含收益承诺，不超过 28 字。
  {report_content}
  只返回标题文本。

table_beautify: |
  将以下 {table_name} 数据整理为紧凑 Markdown 表格：
  {table_data}
  保留所有数值、地区、期间、口径、单位和缺失值，不推断、不新增数据。只返回表格。
