# =============================================================================
# Pharsight 医药上市公司研究（pharma_company）—— 经典初始配置
# =============================================================================
# 依据：docs/v1/PHARMA_RESEARCH_WORKFLOW_AND_FINSIGHT_ADAPTATION.md
#   §4.3 首次运行建议场景：单公司 / 单核心资产 / 单适应症 / 固定截止时间
#   §7.4 建议的配置契约：首跑关闭自动任务、实时搜索与图表
#   §7.6 公司模式固定研究清单 C01–C11
#
# 默认口径（全覆盖）：
#   1 家 A/H 医药上市公司，默认覆盖其全部已上市产品和在研管线；
#   中国内地辖区；最近 3 个完整财年 + 最新报告期；预测期 3 年；
#   5–10 份一手资料；输出无图表的中文 Markdown 公司深度报告。
#   如需收窄，在 focus_assets / focus_indications 中列出重点资产或适应症。
#
# 运行前准备：
#   1) 环境变量（写入 pharsight/.env，切勿提交）：
#        DS_MODEL_NAME / DS_API_KEY / DS_BASE_URL     —— 主模型（必填）
#   2) 复制本文件到 user_configs/pharma_company.yaml（该目录已被 gitignore）
#   3) 按 pharma_evidence_manifest.yaml 模板准备授权一手资料并填写 source_manifest
#   4) python run_report.py --config user_configs/pharma_company.yaml --no-resume
#
# 首跑不需要其它模型/服务：
#   strict_citations=true 不需要 Embedding；enable_chart=false 不需要 VLM；
#   live_web_search=false 不需要 Serper 或浏览器。
# =============================================================================

# -----------------------------------------------------------------------------
# 一、研究任务书：冻结研究对象、时间与边界（流程 §3.1）
# -----------------------------------------------------------------------------

# 研究对象：公司法定全称或市场通用简称（示例标的，运行前请替换）
target_name: "恒瑞医药"

# 证券代码（公司模式必填）：A 股 .SH/.SZ，H 股 .HK（示例标的，运行前请替换）
stock_code: "600276.SH"

# 研究模式：pharma_company（上市公司）或 pharma_industry（行业）
target_type: "pharma_company"

# 市场：A｜HK｜US，仅作标识；本项目优先 A/H
market: "A"

# 输出语言：zh｜en，医药研报默认中文
language: "zh"

# 信息截止时间：ISO-8601 且必须带时区；晚于该时间的资料不得进入当期结论
as_of: "2026-09-21T23:59:59+08:00"

# 监管与商业化辖区：中国内地；如核心资产有海外申报，可追加 "US"、"EU"
jurisdictions: ["CN"]

# 重点关注资产：留空 = 全量覆盖公司全部已上市产品和在研管线；
# 需要收窄时填写，例如 ["卡瑞利珠单抗（艾瑞卡，SHR-1210）"]
focus_assets: []

# 重点关注适应症：留空 = 全部适应症；需要收窄时填写，例如 ["肝细胞癌"]
focus_indications: []

# 本次要回答的核心争议：报告结论必须回到这些问题（流程 §3.8）
research_questions:
  - "核心临床证据能否支持当前商业化预期？"
  - "当前估值隐含了怎样的上市时间、渗透率和峰值销售？"
  - "哪些事件会证伪核心投资论点？"

# -----------------------------------------------------------------------------
# 二、输出与模板
# -----------------------------------------------------------------------------

# 输出目录：必须位于 pharsight 仓库内；outputs/ 已被 gitignore，产物不入库
output_dir: "./outputs/pharma-company-v1"

# 输出格式：首跑只验收 Markdown；docx/pdf 转换属环境相关的次级验收
output_formats: ["md"]

# 中文公司报告大纲模板（报告章节结构）
outline_template_path: "src/template/pharma_company_outline_zh.md"

# DOCX 样式模板：仅当 output_formats 含 docx 时使用，Markdown 首跑可忽略
reference_doc_path: "src/template/report_template.docx"

# -----------------------------------------------------------------------------
# 三、来源计划与工作流开关（流程 §7.4、§7.5）
# -----------------------------------------------------------------------------

# 受控资料包：5–10 份授权一手资料（交易所披露、监管文件、试验注册、论文、医保/集采）。
# 相对路径以 pharsight 仓库根目录解析；运行前该清单必须存在且至少含 1 条
# 不晚于 as_of 的来源，否则流程按设计失败关闭。
# 模板见 docs/example_configs/pharma_evidence_manifest.yaml。
source_manifest: null

# 关闭 LLM 自动扩展任务，只执行下方固定研究清单，保证首跑可复现
auto_generate_tasks: true

# 关闭实时搜索：经典首跑只用受控资料包，不依赖 Serper/浏览器
live_web_search: true

# 分析与写作阶段不联网；需要发现线索时再逐项打开
live_web_search_in_analysis: true
live_web_search_in_report: true

# 严格截止时间：发布或更新时间晚于 as_of 的来源直接排除
strict_cutoff: true

# 严格引用：只允许 [Source:Sxxx] 形式，且必须解析到本次资料包中的来源
strict_citations: true

# 要求重大事实必须带引用；无引用报告不得发布
require_citations: true

# 任一采集/分析任务失败即中止，不静默降级
fail_fast: true

# 首跑关闭图表与 VLM 路径，先验证内容主流程
enable_chart: false

# 工具白名单：首跑只放开 pharma 受控证据工具；
# 需要直接调用现有财务 API 时改为 ["pharma", "financial"]，
# 但财务工具结果不携带来源编号，重大数字仍须以资料包为准
allowed_tool_categories: ["pharma"]

# 按任务选择证据：证据条数超过阈值时，只把与当前分析/章节最相关的来源注入提示词，
# 未展示的记录仍可在代码中按 data_id 读取。auto（默认）｜off（总是全量）｜llm（总是选择）
evidence_selection: "auto"
evidence_selection_threshold: 10   # auto 模式下证据超过该条数才启用选择
evidence_selection_max_k: 12       # 单个分析/章节任务最多注入的来源数

# 断点续跑缓存：输入、模型、代码和资料快照变化后请改用 --no-resume
use_collect_data_cache: true
use_analysis_cache: true
use_report_outline_cache: true
use_full_report_cache: true
use_post_process_cache: true

# -----------------------------------------------------------------------------
# 四、固定采集任务（流程 §7.6 的 C01–C09：每条只采证据，不下结论）
# -----------------------------------------------------------------------------
custom_collect_tasks:
  # C01 公司与证券身份
  - "核对公司法律实体、证券代码、交易所、报告期、股本与主要股东，收集最近三年及最新一期法定披露"
  # C02 历史财务和分部收入
  - "按产品、地区与报告期收集最近三个完整财年及最新报告期的收入、利润、现金流、研发投入和分部数据"
  # C03 商业化产品（全部上市产品）
  - "穷尽公司全部已上市产品，按产品—适应症—地区收集标签、收入、销量、价格、医保、集采和生命周期信息"
  # C04 研发管线（全部在研资产）
  - "穷尽公司全部在研管线，按药物—适应症—地区—阶段收集资产、下一里程碑及其证据来源"
  # C05 关键临床试验
  - "按试验注册号收集全部关键试验的分期、设计、终点、结果、更新时间和证据类型（注册、论文、监管或新闻稿）"
  # C06 注册与批准事件
  - "收集核心资产的申请、受理、审评、批准、标签变更和上市后安全信息，区分事件阶段"
  # C07 医保、集采和价格
  - "收集国家医保目录、谈判/竞价、支付标准、集采报量与降幅、医院准入和实际放量证据"
  # C08 竞争产品与标准治疗
  - "收集现行指南、标准治疗、已上市竞品和主要在研竞品，并记录各来源的证据限制"
  # C09 患者漏斗和市场规模
  - "收集患病、诊断、治疗线次、渗透率、定价、商业化投入和估值所需的一手市场数据"

# -----------------------------------------------------------------------------
# 五、固定分析任务（流程 §4.1/§7.7：来源事实、确定性计算、显式假设、模型判断分离）
# -----------------------------------------------------------------------------
custom_analysis_tasks:
  # C01/C02 财务与业务质量
  - "分析历史财务质量、产品收入结构、研发投入、现金流和融资需求，标出异常项与口径差异"
  # C03 商业化产品
  - "评价已上市产品的临床与监管基础、生命周期阶段和增长驱动，区分标签事实与推断"
  # C04/C05 管线与临床证据
  - "评价全部在研管线和关键试验的证据强度、统计与临床意义、试验局限和下一里程碑"
  # C06/C07 监管与支付
  - "分析注册路径、标签范围、医保与集采规则对价格、可及性和放量的传导"
  # C08 竞争格局
  - "建立标准治疗与竞品矩阵，评估差异化证据和可能改变市场份额的事件"
  # C09/C10 患者漏斗与收入预测
  - "建立患者漏斗到产品收入的传导，逐项标注来源事实、确定性计算和显式假设，并给出情景"
  # C10 财务预测与估值
  - "选择与公司阶段匹配的估值方法（成熟制药 PE/EV-EBITDA/DCF，临床阶段 rNPV），形成基准/乐观/悲观情景与敏感性"
  # C11 催化剂、风险与证伪条件
  - "整理 3–18 个月催化剂时间窗、下行传导机制、风险和可验证的证伪条件"
  # 综合投资论点
  - "综合形成变异观点、市场已计价预期和研究结论，并明确证据缺口与不确定性"

# -----------------------------------------------------------------------------
# 六、模型配置：受控首跑只需要主模型；不要在配置中写明文密钥
# -----------------------------------------------------------------------------
llm_config_list:
  - model_name: "${DS_MODEL_NAME}"   # 主模型（环境变量）
    api_key: "${DS_API_KEY}"         # API Key（环境变量，禁止提交）
    base_url: "${DS_BASE_URL}"       # 兼容 OpenAI 协议的接口地址
    generation_params:
      temperature: 0.3               # 低温以保持事实一致性和可复现性
      max_tokens: 32768
      top_p: 0.95
  - model_name: "${EMBEDDING_MODEL_NAME}"
    api_key: "${EMBEDDING_API_KEY}"
    base_url: "${EMBEDDING_BASE_URL}"
  - model_name: "${VLM_MODEL_NAME}"
    api_key: "${VLM_API_KEY}"
    base_url: "${VLM_BASE_URL}"